name: Vigilancia diaria de vuelos

on:
  schedule:
    # GitHub puede retrasar las ejecuciones programadas VARIAS HORAS (el 18/10 terminó a las
    # 09:50, después de la tarea de Claude de las 7:51). Por eso se lanza la noche anterior:
    # 22:17 UTC = 00:17 en verano / 23:17 en invierno (hora de Madrid) -> ~7 h de margen.
    # Segunda ejecución de respaldo a las 01:47 UTC por si GitHub se salta la primera.
    # (Minutos "raros" para evitar las horas en punto, que es cuando GitHub va más saturado.)
    - cron: "17 22 * * *"
    - cron: "47 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vigilancia
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          # Última versión de la rama al EMPEZAR (si el respaldo estaba en cola, ve el informe recién hecho)
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || (sleep 30 && pip install -r requirements.txt)

      - name: Buscar vuelos
        id: buscar
        continue-on-error: true
        timeout-minutes: 280
        env:
          # La ejecución de respaldo (01:47 UTC) no repite si la de las 22:17 ya terminó bien
          SALTAR_SI_RECIENTE_HORAS: ${{ github.event.schedule == '47 1 * * *' && '8' || '0' }}
        run: python -u buscador.py

      - name: Guardar resultados en el repo
        if: always()
        run: |
          mkdir -p data
          git config user.name "vigilancia-bot"
          git config user.email "vigilancia-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Vigilancia $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Reintentando push ($i)..."; sleep 15
          done
          exit 1

      - name: Avisar si la búsqueda falló
        if: steps.buscar.outcome == 'failure'
        run: |
          echo "::error::buscador.py terminó con error. Revisa data/ultimo.md (sección Avisos) y el log del paso 'Buscar vuelos'."
          exit 1
