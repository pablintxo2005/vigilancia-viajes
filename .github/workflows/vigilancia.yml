name: Vigilancia diaria de vuelos

on:
  schedule:
    # 03:05 UTC = 05:05 en verano / 04:05 en invierno (hora de Madrid).
    # Margen de sobra antes de la tarea de Claude (7:51), aunque GitHub retrase el arranque.
    - cron: "5 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vigilancia
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || (sleep 30 && pip install -r requirements.txt)

      - name: Buscar vuelos
        id: buscar
        continue-on-error: true
        timeout-minutes: 120
        run: python -u buscador.py

      - name: Guardar resultados en el repo
        if: always()
        run: |
          mkdir -p data
          git config user.name "vigilancia-bot"
          git config user.email "vigilancia-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Vigilancia $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Reintentando push ($i)..."; sleep 15
          done
          exit 1

      - name: Avisar si la búsqueda falló
        if: steps.buscar.outcome == 'failure'
        run: |
          echo "::error::buscador.py terminó con error. Revisa data/ultimo.md (sección Avisos) y el log del paso 'Buscar vuelos'."
          exit 1
