name: Vigilancia diaria de vuelos

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vigilancia
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Buscar vuelos
        run: python buscador.py

      - name: Guardar resultados en el repo
        if: always()
        run: |
          git config user.name "vigilancia-bot"
          git config user.email "vigilancia-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Vigilancia $(date -u +%F)"
          git push
