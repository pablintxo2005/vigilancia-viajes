# Configuración de la vigilancia de viajes
# Puedes editar este archivo desde GitHub (icono del lápiz). Si algo queda mal escrito,
# el script usa la configuración original y lo avisa en data/ultimo.md, pero no se rompe.
# IMPORTANTE: los viajeros NO tienen coche. Todo el transporte por tierra es tren/bus/lanzadera.

moneda: EUR
idioma: es
pausa_entre_peticiones_s: 1.0   # pausa entre consultas a Google Flights
max_peticiones_google: 1400     # tope diario de consultas a Google Flights
tiempo_max_google_min: 75       # si se supera, corta Google y guarda lo conseguido
timeout_peticion_s: 30          # tiempo máximo de espera por consulta
max_escalas: 1
historico_dias: 30              # días de histórico que se conservan

umbral_aviso_ida_vuelta_eur: 150
bajada_relevante_pct: 20

# Solo viajes al extranjero: se descartan destinos en estos países (código ISO de 2 letras)
excluir_paises_destino: [ES]

# Zona de búsqueda: toda Europa (incluido Reino Unido, Irlanda, Islandia, Noruega, Suiza, Balcanes,
# Turquía…) y norte de África. Destinos fuera de estos países se descartan.
paises_permitidos: [AL, AD, AT, BE, BA, BG, HR, CY, CZ, DK, EE, FI, FR, DE, GR, HU, IS, IE, IT, XK,
                    LV, LI, LT, LU, MT, MD, MC, ME, NL, MK, "NO", PL, PT, RO, SM, RS, SK, SI, SE, CH,
                    UA, GB, GI, GG, JE, IM, FO, TR, VA,
                    MA, DZ, TN, LY, EG]

# Fines de semana con OTRAS aerolíneas (Vueling, Volotea, Iberia, Lufthansa, easyJet…) desde
# Bilbao (BIO), vía Google Flights. Cada día se revisan unos pocos fines de semana distintos
# (rotando) a estos destinos, y entran en las mismas secciones que las ofertas de Ryanair.
google_findes:
  activo: true
  origen: BIO
  findes_por_dia: 2              # fines de semana revisados cada día (1 próximo + 1 desde enero)
  destinos: [AMS, CDG, ORY, LHR, LGW, BRU, FRA, MUC, ZRH, GVA, LIS, OPO, FCO, MXP, VCE, NCE,
             MRS, LYS, DUB, EDI, CPH, VIE, PRG, BUD, BER, RAK, TNG, ATH, MLA, KRK]

viajeros:
  A:
    nombre: "Stuttgart"
    aeropuertos: [STR, FKB, FMM, FDH, FRA, MUC, ZRH, BSL]
    principales_esqui: [STR, FMM, MUC, ZRH]        # para no disparar el nº de consultas
  B:
    nombre: "Bilbao"
    aeropuertos: [BIO, EAS, VIT, SDR, BIQ, PNA]
    principales_esqui: [BIO, SDR, BIQ]

# Destinos de esquí, pensados para llegar SIN COCHE (tren/bus desde el aeropuerto).
# aeropuertos: a < ~2-3 h en transporte público de la base.
# vuela_A: false -> el viajero de Stuttgart va en tren (lo calcula la tarea de Claude).
# base: pueblo/ciudad donde se busca alojamiento (bien conectado con pistas en transporte público).
destinos_esqui:
  - zona: "Tirol (Innsbruck: Stubai, Axamer Lizum, Nordkette)"
    aeropuertos: [INN, MUC, SZG]
    vuela_A: false
    base: {nombre: "Innsbruck", lat: 47.2654, lon: 11.3928}
    transporte: "Tren directo MUC/SZG→Innsbruck; ski-bus gratis con el forfait a las estaciones"
  - zona: "Salzburgerland (Schladming-Dachstein, Ski Amadé)"
    aeropuertos: [SZG, MUC]
    vuela_A: false
    base: {nombre: "Schladming", lat: 47.3925, lon: 13.6872}
    transporte: "Tren SZG→Schladming (~1h30); estación a pie del telecabina Planai"
  - zona: "Graubünden (Davos-Klosters, Laax)"
    aeropuertos: [ZRH]
    vuela_A: false
    base: {nombre: "Davos", lat: 46.8027, lon: 9.8360}
    transporte: "Tren ZRH→Davos (~2h20, SBB/RhB); A llega en tren Stuttgart→Zúrich"
  - zona: "Valais / Mont Blanc (Chamonix, Verbier)"
    aeropuertos: [GVA, LYS]
    vuela_A: false
    base: {nombre: "Chamonix", lat: 45.9237, lon: 6.8694}
    transporte: "Lanzadera/bus GVA→Chamonix (~1h15); tren Mont-Blanc Express"
  - zona: "Dolomitas (Val Gardena, Alta Badia)"
    aeropuertos: [VRN, BGY, VCE, TSF, INN]
    vuela_A: false
    base: {nombre: "Ortisei (Val Gardena)", lat: 46.5747, lon: 11.6714}
    transporte: "Tren a Bolzano/Ponte Gardena + bus 350 a Val Gardena"
  - zona: "Valle de Aosta (Pila, Cervinia, Courmayeur)"
    aeropuertos: [TRN, MXP, GVA]
    vuela_A: false
    base: {nombre: "Aosta", lat: 45.7370, lon: 7.3150}
    transporte: "Tren/bus a Aosta; telecabina Aosta→Pila desde la ciudad"
  - zona: "Andorra (Grandvalira, Pal-Arinsal)"
    aeropuertos: [BCN, TLS]
    vuela_A: true
    base: {nombre: "Andorra la Vella", lat: 42.5063, lon: 1.5218}
    transporte: "Bus directo BCN/TLS→Andorra (~3h, Andbus/Alsa); ski-bus a pistas"
  - zona: "Bansko (Bulgaria)"
    aeropuertos: [SOF]
    vuela_A: true
    base: {nombre: "Bansko", lat: 41.8383, lon: 23.4885}
    transporte: "Transfer/bus Sofía→Bansko (~2h30); telecabina desde el pueblo"

# Esquí: viajes de entre 3 y 6 días. Cada día se revisa una ventana distinta de días
# de salida (rota por toda la temporada) y se prueban todas las duraciones posibles.
temporada_esqui:
  desde: "2026-12-10"
  hasta: "2027-03-31"
  dias_min: 3                    # 3 días = 2 noches
  dias_max: 6                    # 6 días = 5 noches
  ventana_dias_salida: 6         # días de salida distintos revisados cada día

# Escapadas próximas (Ryanair) desde los aeropuertos de Bilbao
# SOLO FINES DE SEMANA: ida el viernes y vuelta el domingo.
sorpresa:
  semanas_vista: 10              # se miran los fines de semana de las próximas 10 semanas
  duracion_min_dias: 2
  duracion_max_dias: 2
  dias_salida: [vie]
  dias_vuelta: [dom]
  max_ofertas_informe: 6         # destinos distintos que se muestran (con alojamiento)

# Fines de semana a partir de enero (mismas reglas: vie -> dom, fuera de España)
desde_enero:
  activo: true
  desde: "2027-01-01"
  hasta: "2027-06-30"
  mejores_por_mes: 2             # destinos distintos por mes en el informe (con alojamiento)
  comparar_con_bilbao: true      # comprueba en Google Flights si desde BIO sale mejor

# Viajes con FECHAS FIJAS. Se buscan cada noche antes que lo demás (tienen prioridad):
#  - B (Bilbao): Ryanair desde todos sus aeropuertos + otras aerolíneas desde BIO (Google Flights)
#  - alojamiento real en Airbnb para 2 personas en los mejores destinos
#  - A (Stuttgart): el mejor vuelo a la misma ciudad (si "A" está en viajeros); si no hay, va en tren
# Cuando pase la fecha, borra el viaje (el informe lo avisa).
viajes_fijos:
  - nombre: "Fin de semana largo 27-30 noviembre"
    activo: true
    ida: "2026-11-27"            # viernes
    vuelta: "2026-11-30"         # lunes
    viajeros: [B, A]             # B es el principal; A se busca para los destinos de B
    max_destinos: 4              # destinos distintos en el informe (con alojamiento)
    destinos_google: []          # vacío = los de google_findes (desde BIO)
    origenes_google_A: [STR, FMM, MUC, ZRH, FRA]

# Coste y tiempo de llegar desde Stuttgart a cada aeropuerto (tren, por persona y trayecto). ESTIMADOS.
acceso_desde_stuttgart:
  STR: {eur: 4,  min: 30,  como: "S-Bahn S2/S3 Stuttgart Hbf → aeropuerto"}
  FKB: {eur: 15, min: 90,  como: "tren a Baden-Baden + bus 285 al aeropuerto"}
  FMM: {eur: 20, min: 130, como: "tren a Memmingen + bus al aeropuerto"}
  FDH: {eur: 20, min: 150, como: "tren a Friedrichshafen Flughafen"}
  FRA: {eur: 30, min: 90,  como: "ICE Stuttgart → Frankfurt Flughafen"}
  MUC: {eur: 30, min: 180, como: "ICE a München Hbf + S-Bahn S8/S1"}
  ZRH: {eur: 30, min: 180, como: "IC Stuttgart → Zürich Flughafen"}
  BSL: {eur: 30, min: 190, como: "tren a Basel SBB + bus 50"}

# Coste y tiempo de llegar desde Bilbao a cada aeropuerto (transporte público, por persona
# y trayecto). Valores ESTIMADOS: sirven para ordenar las ofertas por coste real.
acceso_desde_bilbao:
  BIO: {eur: 3,  min: 30,  como: "Bizkaibus A3247 (Moyua/Termibus → aeropuerto)"}
  VIT: {eur: 10, min: 80,  como: "bus Bilbao → Vitoria + bus al aeropuerto"}
  SDR: {eur: 9,  min: 85,  como: "ALSA Bilbao → Santander + bus al aeropuerto"}
  EAS: {eur: 11, min: 100, como: "bus Bilbao → Donostia + bus E21 al aeropuerto"}
  BIQ: {eur: 16, min: 150, como: "bus Bilbao → Biarritz (ALSA/FlixBus) + bus al aeropuerto"}
  PNA: {eur: 16, min: 130, como: "bus Bilbao → Pamplona + bus/taxi al aeropuerto"}
valor_tiempo_eur_hora: 15

# Alojamiento con precio real (Airbnb: pisos, apartamentos y también hoteles)
# Para cada destino se buscan tres zonas: CENTRO de la ciudad, AFUERAS y junto al AEROPUERTO
# (si está lejos del centro), con el tiempo al centro y lo que se ahorra frente al centro.
alojamiento:
  activo: true
  huespedes: 2
  radio_centro_km: 1.5           # "en el centro" = a menos de esto del centro
  radio_afueras_km: 12           # búsqueda amplia alrededor del centro (afueras)
  radio_aeropuerto_km: 4         # búsqueda junto al aeropuerto
  opciones_centro: 2
  opciones_baratas: 2
  valoracion_min: 4.5
  resenas_min: 5
  max_busquedas: 90
  tiempo_max_min: 25

# Memoria de rutas sin vuelos (por día de la semana) para no repetir consultas inútiles
sin_ruta:
  fallos_para_saltar: 2          # días distintos sin vuelos antes de saltarla
  dias_memoria: 10               # pasado este tiempo se vuelve a comprobar
